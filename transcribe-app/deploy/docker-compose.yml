# A tiny static-file server that publishes the voicemail audio (AUDIO_STORAGE_DIR) over the
# Traefik + HTTPS already running on this VPS, so the sheet's Download links resolve.
#
# Traefik (root-traefik-1) terminates TLS for 31-97-214-59.sslip.io and routes by Docker labels,
# so this container just joins Traefik's network and claims the /voicemails path with a MORE
# specific router than the agent's Host-only one (Host + PathPrefix, priority 100). Files are
# served read-only and sent as a download (Content-Disposition: attachment).
#
# The served directory MUST match AUDIO_STORAGE_DIR in the transcribe-app .env (/srv/voicemail-audio).
#
# Bring up on the VPS (from the transcribe-app dir):
#   docker compose -f deploy/docker-compose.yml up -d
# After a change to labels, recreate:
#   docker compose -f deploy/docker-compose.yml up -d --force-recreate

services:
  voicemail-files:
    image: caddy:2-alpine
    restart: unless-stopped
    # Set the entrypoint explicitly so `caddy` is always the process (the image runs its binary via
    # CMD, not ENTRYPOINT, so a bare command: would try to exec "file-server" directly). Listing is
    # off by default (no --browse), so the directory index isn't exposed.
    entrypoint: ["caddy"]
    command: ["file-server", "--root", "/srv/audio", "--listen", ":80"]
    volumes:
      - /srv/voicemail-audio:/srv/audio:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voicemails.rule=Host(`31-97-214-59.sslip.io`) && PathPrefix(`/voicemails`)"
      - "traefik.http.routers.voicemails.priority=100"
      - "traefik.http.routers.voicemails.entrypoints=websecure"
      - "traefik.http.routers.voicemails.tls.certresolver=mytlschallenge"
      # Strip /voicemails before hitting the file server, and force the browser to download.
      - "traefik.http.middlewares.vm-strip.stripprefix.prefixes=/voicemails"
      - "traefik.http.middlewares.vm-dl.headers.customresponseheaders.Content-Disposition=attachment"
      - "traefik.http.routers.voicemails.middlewares=vm-strip,vm-dl"
      - "traefik.http.services.voicemails.loadbalancer.server.port=80"

networks:
  # Traefik's existing network (same as openai-agent-app), attached as external.
  traefik:
    external: true
    name: root_default
