# Runs the two processes as containers on this Docker + Traefik box.
#
#   server  — the media-stream WebSocket. Joined to Traefik's network and labeled so Traefik
#             routes https://31-97-214-59.sslip.io (:443) to it and auto-issues the TLS cert.
#   poller  — outbound only (finds leads, places calls); no ingress, no labels.
#
# Both read the same .env. Bring up with:  docker compose up -d --build
#
# IMPORTANT: set the external network name below to Traefik's network (find it with:
#   docker inspect root-traefik-1 -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}'
# ). The server MUST share a network with Traefik or Traefik can't reach it.

services:
  server:
    build: .
    restart: unless-stopped
    env_file: .env
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openai-agent.rule=Host(`31-97-214-59.sslip.io`)"
      - "traefik.http.routers.openai-agent.entrypoints=websecure"
      - "traefik.http.routers.openai-agent.tls.certresolver=mytlschallenge"
      # Which container port Traefik forwards to (our uvicorn server). WebSockets pass through
      # automatically — Traefik forwards the Upgrade handshake with no extra config.
      - "traefik.http.services.openai-agent.loadbalancer.server.port=5050"

  poller:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "scripts/run_poller.py"]
    # The poller now RECEIVES notifications from the backend ("this lead is due"), so unlike
    # before it needs ingress. It shares the server's hostname and is separated by PATH: Traefik
    # sends /poller/* here and everything else to the server. `priority` is set explicitly because
    # both routers match the same Host and rule-length tie-breaking is not something to rely on.
    #
    # Dialing deliberately stays in THIS container, not the server: `place_call` uses the blocking
    # Twilio SDK, and running it on the server's event loop would stall live call audio.
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openai-poller.rule=Host(`31-97-214-59.sslip.io`) && PathPrefix(`/poller`)"
      - "traefik.http.routers.openai-poller.priority=100"
      - "traefik.http.routers.openai-poller.entrypoints=websecure"
      - "traefik.http.routers.openai-poller.tls.certresolver=mytlschallenge"
      - "traefik.http.services.openai-poller.loadbalancer.server.port=5060"

  # The messages the assistant TAKES, written into the test spreadsheet as rows.
  #
  # Here rather than in transcribe-app because it only has work to do while the agent is live: it
  # turns "a caller wanted an appointment and nobody was free" into a row the front desk can act
  # on. Bringing the agent up brings this up with it, so a message can never sit unwritten because
  # somebody forgot a second command.
  #
  # NOT the live voicemail poller. That is a different program, on systemd, reading a mailbox and
  # writing to the client's sheet — untouched by any of this.
  #
  # No ingress: it makes outbound requests only, so it needs no Traefik labels and no network.
  messages:
    build:
      context: ../transcribe-app
    # on-failure, not unless-stopped: the only way this exits non-zero is a configuration it has
    # refused (a missing key, or one still pointing at the client's sheet), and that is permanent
    # until a person fixes it. Restarting forever would bury the reason in a wall of identical
    # refusals. Transient trouble — the backend being briefly unreachable — is caught inside the
    # loop and never reaches the exit code, so nothing recoverable is given up on here.
    restart: on-failure:3
    volumes:
      # .env.test decides WHERE rows go and must supply every such setting itself.
      - ../transcribe-app/.env.test:/app/.env.test:ro
      # .env is mounted read-only and is NEVER used to do work — only so the writer can refuse to
      # start if .env.test points at the same sheet. Without it that check cannot run, and the
      # writer treats a missing .env as a reason to stop rather than a reason to continue.
      - ../transcribe-app/.env:/app/.env:ro
      # No credentials mount: this deployment supplies the service account as
      # GOOGLE_CLIENT_EMAIL + GOOGLE_PRIVATE_KEY inside .env, which is already mounted above.
      # Same account for both sheets — access is decided by which sheet id is configured, not by
      # which key signs the request.

networks:
  # Traefik's existing network, attached as external so we don't recreate it.
  traefik:
    external: true
    name: root_default
