<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feedback (mockup)</title>
<link rel="stylesheet" href="mockup.css" />
<script src="shell.js"></script>
</head>
<body>
<div id="page">
  <div class="page-h">
    <div class="col"><h1 class="h1">Feedback</h1><span class="sub">What customers sent from the dashboard.</span></div>
    <span class="spacer"></span><span class="pin">1</span>
  </div>
  <div class="card">
    <div class="card-h"><div class="seg"><button class="on" data-seg="o">Open<span class="n">1</span></button><button data-seg="r">Resolved<span class="n">4</span></button></div><span class="spacer"></span><select class="select"><option>Any category</option><option>Bug</option><option>Idea</option></select></div>
    <div class="card-b col" style="gap:16px">
      <div class="row" style="align-items:flex-start;gap:12px">
        <span class="avatar">SC</span>
        <div class="col" style="gap:4px;flex:1">
          <div class="row"><b style="font-weight:600">Sam Customer</b><span class="cap">sam@tecace.com · Sep 28</span><span class="badge">Idea</span></div>
          <p style="margin:0">Weekly email digest of the calls would be great.</p>
        </div>
        <button class="btn sm"><i data-i="check"></i>Mark resolved</button>
      </div>
    </div>
  </div>
</div>
<script>
mount({
  active: "feedback", crumbs: ["Admin", "Feedback"],
  notes: [
    "관리자 메뉴에는 받은 피드백만 둡니다. 'Send feedback'(누구나 쓰는 양식)은 사이드바 아래 계정 메뉴의 대화상자로 옮기는 안입니다. 사이드바 항목이 하나 줄어듭니다.",
  ],
});
</script>
</body>
</html>
