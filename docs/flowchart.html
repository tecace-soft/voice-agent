<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Intake Agent — Flow Chart (downloadable)</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f5f7f9; color: #1a2230; }
  .bar { position: sticky; top: 0; display: flex; gap: .6rem; align-items: center;
         padding: .8rem 1.2rem; background: #fff; border-bottom: 1px solid #e4e8ee; }
  .bar h1 { font-size: 1rem; margin: 0 auto 0 0; font-weight: 600; }
  button { font: inherit; font-size: .9rem; cursor: pointer; padding: .5rem .9rem;
           border-radius: 8px; border: 1px solid #2f7ea3; background: #2f7ea3; color: #fff; }
  button.secondary { background: #fff; color: #2f7ea3; }
  button:disabled { opacity: .5; cursor: default; }
  #chart { padding: 2rem 1.2rem; display: grid; place-items: center; }
  #chart svg { max-width: 100%; height: auto; }
  .hint { color: #5c6675; font-size: .85rem; padding: 0 1.2rem 2rem; text-align: center; }
  #status { color: #bd5566; }
</style>
</head>
<body>
  <div class="bar">
    <h1>Voice Intake Agent — Flow Chart</h1>
    <button id="svg" class="secondary" disabled>Download SVG</button>
    <button id="png" disabled>Download PNG</button>
  </div>
  <div id="chart">Rendering diagram…</div>
  <p class="hint"><span id="status"></span>
     Needs internet the first time (loads the diagram renderer).
     SVG is vector — best for slides and docs. PNG is a 2× raster image.</p>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    // Plain-text labels (no <b>, no HTML entities) so the SVG has no
    // <foreignObject> and can be rasterized to a PNG canvas.
    const graph = `%%{init: {'theme':'base','themeVariables':{'fontFamily':'ui-sans-serif, system-ui, sans-serif','fontSize':'14px','lineColor':'#8a94a6','primaryColor':'#eceff3','primaryTextColor':'#222a36','primaryBorderColor':'#b9c2ce','edgeLabelBackground':'#eceff3'}}}%%
flowchart TD
    Form[/"Caller submits the Google Form online"/]:::caller --> Poll["Poll finds the new submission<br/>Google Forms"]:::forms
    Poll --> Queue["Outbound call queue<br/>one at a time, retries, so no one is missed<br/>Twilio"]:::twilio
    Queue --> Call["Place the call<br/>Twilio"]:::twilio
    Call -. "no answer or busy: retry with backoff" .-> Queue
    Call --> Ready{"Ready to pick a time now?"}
    Ready -->|No, later| CB["Ask for a better time to call<br/>Gemini, ElevenLabs"]:::voice
    CB -->|schedule ring-back| Queue
    Ready -->|Yes| Offer

    Dial(["Caller dials the number"]):::twilio --> Ask["Ask the language, then the questions<br/>Gemini asks, ElevenLabs speaks"]:::gemini
    Ask --> Say[/Caller answers/]:::caller
    Say --> Understand["Understand the answer<br/>Gemini"]:::gemini
    Understand --> Done{"All questions answered?"}
    Done -->|No| Ask
    Done -->|Yes| Offer

    Offer["Offer a few open times<br/>Cal.com - weekdays 8-5 - ElevenLabs"]:::cal --> Resp[/Caller responds/]:::caller
    Resp --> Intent{"Interpret the reply<br/>Gemini"}
    Intent -->|Picks a time / yes| Ack
    Intent -->|Asks a specific time| Check["Let me check that time<br/>Cal.com"]:::cal
    Intent -->|Other times / no| Others["Offer that day's other openings<br/>Cal.com"]:::cal
    Others --> Resp
    Check --> Free{"Is that time open?"}
    Free -->|Yes| Prop["Propose that time"]:::cal
    Free -->|No| Near["Propose the nearest opening"]:::cal
    Prop --> Resp
    Near --> Resp

    Ack["Setting it up, one moment<br/>ElevenLabs"]:::voice --> Book["Create the booking<br/>Cal.com"]:::cal
    Book --> Save["Save the record<br/>Google Sheets"]:::sheets
    Save --> Confirm["Confirm the appointment, then goodbye<br/>ElevenLabs"]:::voice
    Confirm --> End(["Call ends"])

    classDef forms fill:#e7e9f7,stroke:#4a5bb0,color:#2b3470,stroke-width:1.5px;
    classDef gemini fill:#d8f0eb,stroke:#1c8f84,color:#0f5951,stroke-width:1.5px;
    classDef voice fill:#f7e0e4,stroke:#bd5566,color:#7a2f3a,stroke-width:1.5px;
    classDef cal fill:#f4e7d1,stroke:#b0782c,color:#6e4a15,stroke-width:1.5px;
    classDef sheets fill:#daefe2,stroke:#3f8f5c,color:#245638,stroke-width:1.5px;
    classDef twilio fill:#f7ddda,stroke:#c0453f,color:#7a2622,stroke-width:1.5px;
    classDef caller fill:#eceff3,stroke:#6b7686,color:#333b47,stroke-width:1.5px,stroke-dasharray:5 3;`;

    let svgEl = null;
    const status = document.getElementById("status");

    function download(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function serialized() {
      const clone = svgEl.cloneNode(true);
      const vb = svgEl.viewBox.baseVal;
      if (vb && vb.width) {
        clone.setAttribute("width", vb.width);
        clone.setAttribute("height", vb.height);
      }
      return new XMLSerializer().serializeToString(clone);
    }

    (async () => {
      try {
        mermaid.initialize({ startOnLoad: false, securityLevel: "loose",
                             flowchart: { htmlLabels: false } });
        const { svg } = await mermaid.render("flow", graph);
        document.getElementById("chart").innerHTML = svg;
        svgEl = document.querySelector("#chart svg");
        document.getElementById("svg").disabled = false;
        document.getElementById("png").disabled = false;
      } catch (e) {
        document.getElementById("chart").textContent = "";
        status.textContent = "Could not load the renderer (check your internet connection). ";
      }
    })();

    document.getElementById("svg").addEventListener("click", () => {
      download(new Blob([serialized()], { type: "image/svg+xml;charset=utf-8" }),
               "voice-agent-flowchart.svg");
    });

    document.getElementById("png").addEventListener("click", () => {
      status.textContent = "";
      const vb = svgEl.viewBox.baseVal;
      const w = (vb && vb.width) ? vb.width : svgEl.getBoundingClientRect().width;
      const h = (vb && vb.height) ? vb.height : svgEl.getBoundingClientRect().height;
      const scale = 2;
      const blob = new Blob([serialized()], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(w * scale);
        canvas.height = Math.ceil(h * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((png) => {
          if (png) download(png, "voice-agent-flowchart.png");
          else status.textContent = "PNG export failed in this browser — use Download SVG instead. ";
        }, "image/png");
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        status.textContent = "PNG export failed in this browser — use Download SVG instead. ";
      };
      img.src = url;
    });
  </script>
</body>
</html>
