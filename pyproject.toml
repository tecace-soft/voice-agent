[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice intake agent: Hermes drives the conversation, Gemini extracts the data"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "websockets>=13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
